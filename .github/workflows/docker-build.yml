name: Reusable Docker Build & Scan

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name (e.g. ghcr.io/owner/app or owner/app)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      push:
        description: 'Whether to push image to registry'
        required: false
        type: boolean
        default: false
      tags:
        description: 'Comma/newline-separated tags'
        required: false
        type: string
        default: 'latest'
      registry:
        description: 'Target registry (e.g. ghcr.io or docker.io)'
        required: false
        type: string
        default: 'ghcr.io'
      platforms:
        description: 'Target platforms (e.g. linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry username'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry password or token'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49ed152c8ecd829dc54c4637b6770e5c707535b4 # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca5143103720a1ac763b066d5b6932b1d04e5e # v3.10.0

      - name: Log in to Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v5.1.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
