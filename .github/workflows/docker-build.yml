name: Reusable Docker Build & Scan

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name (e.g. ghcr.io/owner/app or owner/app)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      push:
        description: 'Whether to push image to registry'
        required: false
        type: boolean
        default: false
      tags:
        description: 'Comma/newline-separated tags'
        required: false
        type: string
        default: 'latest'
      registry:
        description: 'Target registry (e.g. ghcr.io or docker.io)'
        required: false
        type: string
        default: 'ghcr.io'
      platforms:
        description: 'Target platforms (e.g. linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry username'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry password or token'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: inputs.push && secrets.REGISTRY_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
