name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use (e.g. "3.10", "3.11", "3.12")'
        required: false
        type: string
        default: '3.11'
      requirements-file:
        description: 'Path to requirements.txt (if using requirements)'
        required: false
        type: string
        default: 'requirements.txt'
      run-lint:
        description: 'Whether to run linting (ruff)'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to run test suite'
        required: false
        type: boolean
        default: true
      test-command:
        description: 'Command to run tests'
        required: false
        type: string
        default: 'pytest'
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  python-ci:
    name: Python CI (${{ inputs.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Upgrade Pip & Base Tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: |
          if [ -f "${{ inputs.requirements-file }}" ]; then
            echo "Installing dependencies from ${{ inputs.requirements-file }}..."
            pip install -r "${{ inputs.requirements-file }}"
          elif [ -f "pyproject.toml" ]; then
            echo "Installing project from pyproject.toml..."
            pip install .
          else
            echo "No requirements.txt or pyproject.toml found in working directory."
          fi

      - name: Run Ruff Linter
        if: inputs.run-lint
        run: |
          pip install ruff
          ruff check .

      - name: Run Unit Tests
        if: inputs.run-test
        run: |
          pip install pytest pytest-cov
          ${{ inputs.test-command }}
