name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use (e.g. "3.10", "3.11", "3.12")'
        required: false
        type: string
        default: '3.11'
      requirements-file:
        description: 'Path to requirements.txt or pyproject.toml'
        required: false
        type: string
        default: 'requirements.txt'
      run-lint:
        description: 'Whether to run linting (ruff / flake8)'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to run pytest'
        required: false
        type: boolean
        default: true
      test-command:
        description: 'Command to run tests'
        required: false
        type: string
        default: 'pytest'
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  python-ci:
    name: Python CI (${{ inputs.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Upgrade Pip & Install Base Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${{ inputs.requirements-file }}" ]; then
            pip install -r "${{ inputs.requirements-file }}"
          elif [ -f "pyproject.toml" ]; then
            pip install ".[test,dev]" || pip install .
          fi

      - name: Run Ruff Linter
        if: inputs.run-lint
        run: |
          pip install ruff || true
          ruff check . || echo "Ruff check completed"

      - name: Run Unit Tests
        if: inputs.run-test
        run: |
          pip install pytest pytest-cov || true
          ${{ inputs.test-command }}
