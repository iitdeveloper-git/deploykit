name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use (e.g. "20", "22", "lts/*")'
        required: false
        type: string
        default: '20'
      package-manager:
        description: 'Package manager ("npm", "yarn", "pnpm", "bun")'
        required: false
        type: string
        default: 'npm'
      run-lint:
        description: 'Whether to execute npm run lint'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to execute npm test'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Whether to execute npm run build'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  node-ci:
    name: Node.js CI (${{ inputs.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || (inputs.package-manager == 'yarn' && 'yarn' || (inputs.package-manager == 'pnpm' && 'pnpm' || '')) }}

      - name: Install Dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      - name: Install Dependencies (yarn)
        if: inputs.package-manager == 'yarn'
        run: yarn --frozen-lockfile

      - name: Install Dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: npx pnpm install --frozen-lockfile

      - name: Run Lint
        if: inputs.run-lint
        run: npm run lint --if-present

      - name: Run Tests
        if: inputs.run-test
        run: npm test --if-present

      - name: Run Build
        if: inputs.run-build
        run: npm run build --if-present
