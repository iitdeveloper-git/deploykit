name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use (e.g. "20", "22", "lts/*")'
        required: false
        type: string
        default: '20'
      package-manager:
        description: 'Package manager ("npm", "yarn", "pnpm", "bun")'
        required: false
        type: string
        default: 'npm'
      run-lint:
        description: 'Whether to execute lint script'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to execute test script'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Whether to execute build script'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  node-ci:
    name: Node.js CI (${{ inputs.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        if: inputs.package-manager != 'bun'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || (inputs.package-manager == 'yarn' && 'yarn' || (inputs.package-manager == 'pnpm' && 'pnpm' || '')) }}

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest

      - name: Install Dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      - name: Install Dependencies (yarn)
        if: inputs.package-manager == 'yarn'
        run: yarn --frozen-lockfile

      - name: Install Dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: npx pnpm install --frozen-lockfile

      - name: Install Dependencies (bun)
        if: inputs.package-manager == 'bun'
        run: bun install --frozen-lockfile

      - name: Run Lint
        if: inputs.run-lint
        run: |
          if [ "${{ inputs.package-manager }}" = "bun" ]; then
            bun run lint || true
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run lint --if-present
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn run lint || true
          else
            npm run lint --if-present
          fi

      - name: Run Tests
        if: inputs.run-test
        run: |
          if [ "${{ inputs.package-manager }}" = "bun" ]; then
            bun test
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm test --if-present
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn test || true
          else
            npm test --if-present
          fi

      - name: Run Build
        if: inputs.run-build
        run: |
          if [ "${{ inputs.package-manager }}" = "bun" ]; then
            bun run build || true
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run build --if-present
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn run build || true
          else
            npm run build --if-present
          fi
