name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use (e.g. "20", "22", "lts/*")'
        required: false
        type: string
        default: '20'
      package-manager:
        description: 'Package manager ("npm", "yarn", "pnpm", "bun")'
        required: false
        type: string
        default: 'npm'
      run-lint:
        description: 'Whether to execute lint script'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Whether to execute test script'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Whether to execute build script'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  node-ci:
    name: Node.js CI (${{ inputs.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        if: inputs.package-manager != 'bun'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || (inputs.package-manager == 'yarn' && 'yarn' || (inputs.package-manager == 'pnpm' && 'pnpm' || '')) }}

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest

      - name: Install Dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      - name: Install Dependencies (yarn)
        if: inputs.package-manager == 'yarn'
        run: yarn --frozen-lockfile

      - name: Install Dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: npx pnpm install --frozen-lockfile

      - name: Install Dependencies (bun)
        if: inputs.package-manager == 'bun'
        run: bun install --frozen-lockfile

      - name: Run Lint
        if: inputs.run-lint
        run: |
          HAS_LINT="false"
          if [ -f "package.json" ]; then
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)" 2>/dev/null; then
              HAS_LINT="true"
            fi
          fi

          if [ "$HAS_LINT" = "true" ]; then
            echo "Executing lint script..."
            if [ "${{ inputs.package-manager }}" = "bun" ]; then
              bun run lint
            elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
              pnpm run lint
            elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
              yarn run lint
            else
              npm run lint
            fi
          else
            echo "No lint script defined in package.json, skipping."
          fi

      - name: Run Tests
        if: inputs.run-test
        run: |
          HAS_TEST="false"
          if [ -f "package.json" ]; then
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)" 2>/dev/null; then
              HAS_TEST="true"
            fi
          fi

          if [ "${{ inputs.package-manager }}" = "bun" ]; then
            if [ "$HAS_TEST" = "true" ]; then
              bun test
            else
              echo "No test script found, running bun test on test files..."
              bun test || echo "No bun tests found, skipping."
            fi
          elif [ "$HAS_TEST" = "true" ]; then
            echo "Executing test script..."
            if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
              pnpm test
            elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
              yarn test
            else
              npm test
            fi
          else
            echo "No test script defined in package.json, skipping."
          fi

      - name: Run Build
        if: inputs.run-build
        run: |
          HAS_BUILD="false"
          if [ -f "package.json" ]; then
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)" 2>/dev/null; then
              HAS_BUILD="true"
            fi
          fi

          if [ "$HAS_BUILD" = "true" ]; then
            echo "Executing build script..."
            if [ "${{ inputs.package-manager }}" = "bun" ]; then
              bun run build
            elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
              pnpm run build
            elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
              yarn run build
            else
              npm run build
            fi
          else
            echo "No build script defined in package.json, skipping."
          fi
