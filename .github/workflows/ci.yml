name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

  lint-and-validate:
    name: Lint & Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          actionlint_flags: -color

      - name: Set up Python for Linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ruff

      - name: Validate YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, document-start: disable, truthy: disable}}" .

      - name: Run Ruff Lint
        run: |
          ruff check actions/ tests/
