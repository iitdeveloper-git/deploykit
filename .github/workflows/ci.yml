name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test & Coverage Tooling
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Run Tests with 100% Branch Coverage Enforcement
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report -m

  lint-and-validate:
    name: Lint & Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Actionlint
        uses: reviewdog/action-actionlint@7705be0f7ec31a3194a02c89286d94a974b78c85 # v1.65.0
        with:
          actionlint_flags: -color

      - name: Set up Python for Linting
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ruff

      - name: Validate YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, document-start: disable, truthy: disable}}" .

      - name: Run Ruff Lint
        run: |
          ruff check actions/ tests/
