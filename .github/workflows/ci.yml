name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test & Coverage Tooling
        run: |
          python -m pip install --upgrade pip
          pip install coverage pyyaml

      - name: Run Tests with 100% Branch Coverage Enforcement
        run: |
          coverage run --branch -m unittest discover -s tests -p "test_*.py" -v
          coverage report --fail-under=100 -m

  lint-and-validate:
    name: Lint & Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Actionlint
        uses: reviewdog/action-actionlint@47aa36a913e48d523bc46b65210aa56164230d25 # v1.73.2
        with:
          actionlint_flags: -color

      - name: Set up Python for Linting
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ruff

      - name: Validate YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, document-start: disable, truthy: disable}}" .

      - name: Run Ruff Lint
        run: |
          ruff check actions/ tests/
