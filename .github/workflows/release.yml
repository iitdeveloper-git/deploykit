name: Reusable Release Automation

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Git release tag name (defaults to current ref)'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Title of the GitHub Release'
        required: false
        type: string
        default: ''
      body:
        description: 'Markdown description or changelog notes'
        required: false
        type: string
        default: ''
      draft:
        description: 'Whether to create an unpublished draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Whether to mark the release as a pre-release'
        required: false
        type: boolean
        default: false
      generate_release_notes:
        description: 'Whether to automatically generate GitHub release notes'
        required: false
        type: boolean
        default: true
      files:
        description: 'Newline-delimited list or glob pattern of build assets to attach'
        required: false
        type: string
        default: ''
    secrets:
      RELEASE_TOKEN:
        description: 'Optional custom GitHub personal access token with contents:write permission'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386006ae0bf496c148 # v2.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_name || inputs.tag_name || github.ref_name }}
          body: ${{ inputs.body }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate_release_notes }}
          files: ${{ inputs.files }}
