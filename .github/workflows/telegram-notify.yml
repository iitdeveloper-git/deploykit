name: Reusable Telegram Notification

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Application / Project Name'
        required: false
        type: string
        default: ''
      environment:
        description: 'Deployment Environment (Production, Staging, CI / Tests)'
        required: false
        type: string
        default: 'Production'
      status:
        description: 'Deployment / Job Status (success, failure, cancelled)'
        required: false
        type: string
        default: 'success'
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
        default: ''
      app_url:
        description: 'Live Application URL'
        required: false
        type: string
        default: ''
      custom_message:
        description: 'Optional custom release notes or message'
        required: false
        type: string
        default: ''
      message_thread_id:
        description: 'Telegram Topic ID for forum groups'
        required: false
        type: string
        default: ''
    secrets:
      TELEGRAM_BOT_TOKEN:
        description: 'Telegram Bot HTTP API Token'
        required: true
      TELEGRAM_CHAT_ID:
        description: 'Target Telegram Group/Channel Chat ID'
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DeployKit Actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iitdeveloper-git/deploykit
          ref: v1
          sparse-checkout: |
            actions/telegram-notify

      - name: Dispatch Notification
        uses: ./actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message_thread_id: ${{ inputs.message_thread_id }}
          app_name: ${{ inputs.app_name }}
          environment: ${{ inputs.environment }}
          status: ${{ inputs.status }}
          release_tag: ${{ inputs.release_tag }}
          app_url: ${{ inputs.app_url }}
          custom_message: ${{ inputs.custom_message }}
