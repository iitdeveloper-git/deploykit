name: Reusable SSH Docker Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment (e.g. Production, UAT, Staging)'
        required: false
        type: string
        default: 'Production'
      environment-url:
        description: 'Live URL of the deployed environment'
        required: false
        type: string
        default: ''
      service-name:
        description: 'Docker Compose service name to update (required when rollback-on-failure is true)'
        required: false
        type: string
        default: ''
      compose-file:
        description: 'Docker Compose file name on remote host'
        required: false
        type: string
        default: 'docker-compose.yml'
      compose-directory:
        description: 'Directory path on remote host containing the compose file'
        required: false
        type: string
        default: '~/app'
      image-tag:
        description: 'Immutable Docker image tag/version to deploy'
        required: false
        type: string
        default: ''
      health-check-url:
        description: 'HTTP endpoint to verify application health post-deployment'
        required: false
        type: string
        default: ''
      health-check-retries:
        description: 'Maximum health check retry attempts'
        required: false
        type: number
        default: 10
      health-check-delay:
        description: 'Delay in seconds between health check retries'
        required: false
        type: number
        default: 5
      rollback-on-failure:
        description: 'Whether to rollback to previous state if health check fails (requires service-name)'
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_HOST:
        description: 'Remote SSH Host / IP address'
        required: true
      DEPLOY_USER:
        description: 'Remote SSH username'
        required: true
      DEPLOY_SSH_KEY:
        description: 'Private SSH Key for authentication'
        required: true
      DEPLOY_SSH_KNOWN_HOSTS:
        description: 'Known hosts entry or public SSH key fingerprint for strict host verification'
        required: true
      DEPLOY_PORT:
        description: 'Remote SSH port (default: 22)'
        required: false
      REGISTRY_USERNAME:
        description: 'Container registry username'
        required: false
      REGISTRY_PASSWORD:
        description: 'Container registry password or access token'
        required: false
      REGISTRY_URL:
        description: 'Container registry hostname (default: ghcr.io)'
        required: false

permissions:
  contents: read

jobs:
  deploy-ssh:
    name: Deploy to ${{ inputs.environment }} (SSH / Docker)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Deployment Inputs
        env:
          COMPOSE_DIR: ${{ inputs.compose-directory }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVICE: ${{ inputs.service-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          REG_URL: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
          REG_USER: ${{ secrets.REGISTRY_USERNAME || '' }}
          ROLLBACK: ${{ inputs.rollback-on-failure }}
        run: |
          PORT_REGEX='^[0-9]+$'
          SERVICE_REGEX='^[-A-Za-z0-9._]*$'
          COMPOSE_FILE_REGEX='^[-A-Za-z0-9._/]+$'
          COMPOSE_DIR_REGEX='^[-A-Za-z0-9._/~ ]+$'
          IMAGE_TAG_REGEX='^[-A-Za-z0-9._/:]*$'
          REG_URL_REGEX='^[-A-Za-z0-9._:]*$'
          REG_USER_REGEX='^[-A-Za-z0-9._]*$'

          # Validate SSH Port
          if [[ ! "$SSH_PORT" =~ $PORT_REGEX ]] || [ "$SSH_PORT" -lt 1 ] || [ "$SSH_PORT" -gt 65535 ]; then
            echo "❌ DeployKit Security Error: Invalid SSH port: $SSH_PORT"
            exit 1
          fi

          # Validate Service Name
          if [[ ! "$SERVICE" =~ $SERVICE_REGEX ]]; then
            echo "❌ DeployKit Security Error: Invalid service name: $SERVICE"
            exit 1
          fi

          # Validate service-name requirement for rollback-on-failure
          if [ "$ROLLBACK" = "true" ] && [ -z "$SERVICE" ]; then
            echo "❌ DeployKit Validation Error: 'service-name' must be specified when 'rollback-on-failure' is true (rollback is deterministic and service-scoped)."
            exit 1
          fi

          # Validate Compose File (restricted path, no directory traversal)
          if [[ ! "$COMPOSE_FILE" =~ $COMPOSE_FILE_REGEX ]] || [[ "$COMPOSE_FILE" == *".."* ]]; then
            echo "❌ DeployKit Security Error: Invalid compose file path: $COMPOSE_FILE"
            exit 1
          fi

          # Validate Compose Directory (no command injection tokens)
          if [[ ! "$COMPOSE_DIR" =~ $COMPOSE_DIR_REGEX ]] || [[ "$COMPOSE_DIR" == *".."* ]]; then
            echo "❌ DeployKit Security Error: Invalid compose directory: $COMPOSE_DIR"
            exit 1
          fi

          # Validate Image Tag
          if [[ ! "$IMAGE_TAG" =~ $IMAGE_TAG_REGEX ]]; then
            echo "❌ DeployKit Security Error: Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

          # Validate Registry URL & Username
          if [[ ! "$REG_URL" =~ $REG_URL_REGEX ]] || [[ ! "$REG_USER" =~ $REG_USER_REGEX ]]; then
            echo "❌ DeployKit Security Error: Invalid registry coordinates."
            exit 1
          fi

          echo "✅ All deployment parameters validated securely."

      - name: Setup SSH & Verifiable Known Hosts
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "🔒 Strict verifiable host authentication configured (no TOFU)."

      - name: Execute Docker Compose Deployment & Rollback Guard
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          COMPOSE_DIR: ${{ inputs.compose-directory }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVICE: ${{ inputs.service-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          REG_USER: ${{ secrets.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          REG_URL: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
          HEALTH_URL: ${{ inputs.health-check-url }}
          RETRIES: ${{ inputs.health-check-retries }}
          DELAY: ${{ inputs.health-check-delay }}
          ROLLBACK: ${{ inputs.rollback-on-failure }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST}"

          echo "🚀 Connecting to remote host..."

          # Safe registry login via stdin piping (never in command string)
          if [ -n "$REG_PASS" ]; then
            echo "🔑 Authenticating with container registry ${REG_URL}..."
            echo "$REG_PASS" | $SSH_CMD "docker login '${REG_URL}' -u '${REG_USER:-$SSH_USER}' --password-stdin"
          fi

          # Capture exact pre-deploy image ID using docker inspect
          echo "📸 Capturing current container state for rollback guard..."
          CONTAINER_ID=$($SSH_CMD "cd '${COMPOSE_DIR}' && docker compose -f '${COMPOSE_FILE}' ps -q ${SERVICE} 2>/dev/null | head -n1 || echo ''")
          PREV_IMAGE_ID=""

          if [ -n "$CONTAINER_ID" ]; then
            PREV_IMAGE_ID=$($SSH_CMD "docker inspect --format '{{.Image}}' '${CONTAINER_ID}' 2>/dev/null || echo ''")
            if [ -n "$PREV_IMAGE_ID" ] && [ -n "$SERVICE" ]; then
              $SSH_CMD "docker tag '${PREV_IMAGE_ID}' 'deploykit-rollback:${SERVICE}'"
              echo "📸 Captured running image ID ${PREV_IMAGE_ID:0:19} as deploykit-rollback:${SERVICE}"
            fi
          else
            echo "ℹ️ No existing running container detected for service ${SERVICE:-all} prior to deployment."
          fi

          echo "📦 Deploying release (${IMAGE_TAG:-latest})..."
          $SSH_CMD "cd '${COMPOSE_DIR}' && \
            export IMAGE_TAG='${IMAGE_TAG}' && \
            export APP_VERSION='${IMAGE_TAG}' && \
            docker compose -f '${COMPOSE_FILE}' pull ${SERVICE} && \
            docker compose -f '${COMPOSE_FILE}' up -d --remove-orphans ${SERVICE}"

          # Health check probe
          if [ -n "$HEALTH_URL" ]; then
            echo "🏥 Verifying service health at: ${HEALTH_URL}"
            SUCCESS="false"
            for i in $(seq 1 "$RETRIES"); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
                echo "✅ Health check passed with HTTP ${HTTP_CODE} on attempt ${i}."
                SUCCESS="true"
                break
              fi
              echo "⏳ Attempt ${i}/${RETRIES}: Received HTTP ${HTTP_CODE}. Retrying in ${DELAY}s..."
              sleep "$DELAY"
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "❌ Health check failed after ${RETRIES} attempts."

              if [ "$ROLLBACK" = "true" ]; then
                echo "⚠️ DeployKit: Initiating exact image rollback via Compose override..."
                if [ -n "$CONTAINER_ID" ] && [ -n "$PREV_IMAGE_ID" ] && [ -n "$SERVICE" ]; then
                  OVERRIDE_FILE="docker-compose.deploykit-rollback.${SERVICE}.yml"
                  echo "Generating temporary Compose override ${OVERRIDE_FILE} pinning image to deploykit-rollback:${SERVICE} (${PREV_IMAGE_ID:0:19})..."
                  $SSH_CMD "cat << 'EOF' > '${COMPOSE_DIR}/${OVERRIDE_FILE}'
          services:
            ${SERVICE}:
              image: deploykit-rollback:${SERVICE}
          EOF"

                  echo "Restoring previous running container state with Compose override..."
                  $SSH_CMD "cd '${COMPOSE_DIR}' && docker compose -f '${COMPOSE_FILE}' -f '${OVERRIDE_FILE}' up -d --remove-orphans ${SERVICE}"

                  echo "🔄 Rollback dispatched. Verifying rollback health..."
                  sleep "$DELAY"
                  ROLLBACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
                  if [ "$ROLLBACK_CODE" -ge 200 ] && [ "$ROLLBACK_CODE" -lt 400 ]; then
                    echo "✅ DeployKit: Exact image rollback succeeded and verified healthy (HTTP ${ROLLBACK_CODE}). Original deployment failed."
                  else
                    echo "❌ DeployKit: Exact image rollback also failed health check (HTTP ${ROLLBACK_CODE})."
                  fi

                  $SSH_CMD "rm -f '${COMPOSE_DIR}/${OVERRIDE_FILE}'"
                else
                  echo "❌ DeployKit Rollback Error: Cannot rollback because no previous running container or image state was present before deployment."
                fi
              fi

              exit 1
            fi
          fi

          # Prune obsolete images after successful verification
          echo "🧹 Cleaning up obsolete images on host..."
          $SSH_CMD "docker image prune -f" || true
          echo "✅ Remote Docker Compose update verified and completed."

      - name: Cleanup SSH Keys & Rollback Overrides
        if: always()
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          COMPOSE_DIR: ${{ inputs.compose-directory }}
          SERVICE: ${{ inputs.service-name }}
        run: |
          if [ -f ~/.ssh/deploy_key ] && [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SERVICE" ]; then
            SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST}"
            $SSH_CMD "rm -f '${COMPOSE_DIR}/docker-compose.deploykit-rollback.${SERVICE}.yml'" 2>/dev/null || true
          fi
          rm -f ~/.ssh/deploy_key
