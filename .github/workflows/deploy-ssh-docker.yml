name: Reusable SSH Docker Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment (e.g. Production, UAT, Staging)'
        required: false
        type: string
        default: 'Production'
      environment-url:
        description: 'Live URL of the deployed environment'
        required: false
        type: string
        default: ''
      service-name:
        description: 'Docker Compose service name to update (optional; updates all if omitted)'
        required: false
        type: string
        default: ''
      compose-file:
        description: 'Docker Compose file name on remote host'
        required: false
        type: string
        default: 'docker-compose.yml'
      compose-directory:
        description: 'Directory path on remote host containing the compose file'
        required: false
        type: string
        default: '~/app'
      image-tag:
        description: 'Immutable Docker image tag/version to deploy'
        required: false
        type: string
        default: ''
      health-check-url:
        description: 'HTTP endpoint to verify application health post-deployment'
        required: false
        type: string
        default: ''
      health-check-retries:
        description: 'Maximum health check retry attempts'
        required: false
        type: number
        default: 10
      health-check-delay:
        description: 'Delay in seconds between health check retries'
        required: false
        type: number
        default: 5
      rollback-on-failure:
        description: 'Whether to rollback to previous state if health check fails'
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_HOST:
        description: 'Remote SSH Host / IP address'
        required: true
      DEPLOY_USER:
        description: 'Remote SSH username'
        required: true
      DEPLOY_SSH_KEY:
        description: 'Private SSH Key for authentication'
        required: true
      DEPLOY_PORT:
        description: 'Remote SSH port (default: 22)'
        required: false
      DEPLOY_SSH_KNOWN_HOSTS:
        description: 'Known hosts entry or public SSH key fingerprint for strict verification'
        required: false
      REGISTRY_USERNAME:
        description: 'Container registry username'
        required: false
      REGISTRY_PASSWORD:
        description: 'Container registry password or access token'
        required: false
      REGISTRY_URL:
        description: 'Container registry hostname (default: ghcr.io)'
        required: false

permissions:
  contents: read

jobs:
  deploy-ssh:
    name: Deploy to ${{ inputs.environment }} (SSH / Docker)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Deployment Inputs
        env:
          COMPOSE_DIR: ${{ inputs.compose-directory }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVICE: ${{ inputs.service-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # Ensure inputs do not contain dangerous shell metacharacters
          SAFE_REGEX='^[a-zA-Z0-9_./:~ -]*$'

          for var in "$COMPOSE_DIR" "$COMPOSE_FILE" "$SERVICE" "$IMAGE_TAG"; do
            if ! [[ "$var" =~ $SAFE_REGEX ]]; then
              echo "❌ DeployKit Security Error: Input contains invalid or unsafe characters: $var"
              exit 1
            fi
          done
          echo "✅ Deployment inputs validated successfully."

      - name: Setup SSH & Known Hosts
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "🔒 Strict host verification configured via DEPLOY_SSH_KNOWN_HOSTS."
          else
            echo "⚠️ DEPLOY_SSH_KNOWN_HOSTS not provided. Fetching host key with ssh-keyscan..."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Execute Docker Compose Deployment & Rollback Guard
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          COMPOSE_DIR: ${{ inputs.compose-directory }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVICE: ${{ inputs.service-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          REG_USER: ${{ secrets.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          REG_URL: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
          HEALTH_URL: ${{ inputs.health-check-url }}
          RETRIES: ${{ inputs.health-check-retries }}
          DELAY: ${{ inputs.health-check-delay }}
          ROLLBACK: ${{ inputs.rollback-on-failure }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST}"

          echo "🚀 Connecting to remote host..."

          # Optional registry login
          if [ -n "$REG_PASS" ]; then
            echo "🔑 Authenticating with container registry ${REG_URL}..."
            $SSH_CMD "echo '${REG_PASS}' | docker login '${REG_URL}' -u '${REG_USER:-$SSH_USER}' --password-stdin"
          fi

          # Capture pre-deploy state for rollback
          echo "📸 Capturing current container state for rollback guard..."
          PREV_CONTAINER_ID=$($SSH_CMD "cd '${COMPOSE_DIR}' && docker compose -f '${COMPOSE_FILE}' ps -q ${SERVICE}" || echo "")

          echo "📦 Deploying new release (${IMAGE_TAG:-latest})..."
          $SSH_CMD "cd '${COMPOSE_DIR}' && \
            export IMAGE_TAG='${IMAGE_TAG}' && \
            export APP_VERSION='${IMAGE_TAG}' && \
            docker compose -f '${COMPOSE_FILE}' pull ${SERVICE} && \
            docker compose -f '${COMPOSE_FILE}' up -d --remove-orphans ${SERVICE}"

          # Health check probe
          if [ -n "$HEALTH_URL" ]; then
            echo "🏥 Verifying service health at: ${HEALTH_URL}"
            SUCCESS="false"
            for i in $(seq 1 "$RETRIES"); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
                echo "✅ Health check passed with HTTP ${HTTP_CODE} on attempt ${i}."
                SUCCESS="true"
                break
              fi
              echo "⏳ Attempt ${i}/${RETRIES}: Received HTTP ${HTTP_CODE}. Retrying in ${DELAY}s..."
              sleep "$DELAY"
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "❌ Health check failed after ${RETRIES} attempts."

              if [ "$ROLLBACK" = "true" ] && [ -n "$PREV_CONTAINER_ID" ]; then
                echo "⚠️ DeployKit: Initiating automatic rollback to previous container state..."
                $SSH_CMD "cd '${COMPOSE_DIR}' && docker compose -f '${COMPOSE_FILE}' up -d ${SERVICE}"
                echo "🔄 Rollback command dispatched. Verifying rollback health..."
                sleep "$DELAY"
                ROLLBACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
                echo "Rollback health check returned HTTP ${ROLLBACK_CODE}."
              fi

              exit 1
            fi
          fi

          # Prune obsolete images after successful verification
          echo "🧹 Cleaning up obsolete images on host..."
          $SSH_CMD "docker image prune -f" || true
          echo "✅ Remote Docker Compose update verified and completed."

      - name: Cleanup SSH Keys
        if: always()
        run: rm -f ~/.ssh/deploy_key
