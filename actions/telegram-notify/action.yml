name: 'Telegram Release & Deployment Notifier'
description: 'Send standardized, rich Telegram notifications for deployments, CI/CD runs, and releases'
author: 'iitdeveloper-git'
inputs:
  bot_token:
    description: 'Telegram Bot Token from @BotFather'
    required: true
  chat_id:
    description: 'Telegram Group/Channel Chat ID (e.g. -100xxxxxxxxxx)'
    required: true
  message_thread_id:
    description: 'Telegram Topic / Thread ID (for Supergroups with topics enabled)'
    required: false
    default: ''
  app_name:
    description: 'Application / Project Name (e.g. Growixa)'
    required: true
  environment:
    description: 'Deployment Environment (e.g. Production, UAT, CI / Tests)'
    required: true
  status:
    description: 'Job / Deployment Status (success, failure, cancelled)'
    required: true
  release_tag:
    description: 'Release Tag or Version (e.g. v1.0.0)'
    required: false
    default: ''
  app_url:
    description: 'Live Application URL (e.g. https://growixa.iitdeveloper.com)'
    required: false
    default: ''
  custom_message:
    description: 'Optional custom release notes or description'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Send Notification via Telegram Bot API
      shell: bash
      env:
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_APP: ${{ inputs.app_name }}
        INPUT_ENV: ${{ inputs.environment }}
        INPUT_TAG: ${{ inputs.release_tag }}
        INPUT_URL: ${{ inputs.app_url }}
        INPUT_CUSTOM: ${{ inputs.custom_message }}
        INPUT_THREAD_ID: ${{ inputs.message_thread_id }}
        INPUT_BOT_TOKEN: ${{ inputs.bot_token }}
        INPUT_CHAT_ID: ${{ inputs.chat_id }}
        GH_ACTOR: ${{ github.actor }}
        GH_SERVER_URL: ${{ github.server_url }}
        GH_REPO: ${{ github.repository }}
        GH_SHA: ${{ github.sha }}
        GH_RUN_ID: ${{ github.run_id }}
      run: |
        STATUS="${INPUT_STATUS}"
        APP="${INPUT_APP}"
        ENV="${INPUT_ENV}"
        TAG="${INPUT_TAG}"
        URL="${INPUT_URL}"
        CUSTOM="${INPUT_CUSTOM}"
        THREAD_ID="${INPUT_THREAD_ID}"
        BOT_TOKEN="${INPUT_BOT_TOKEN}"
        CHAT_ID="${INPUT_CHAT_ID}"

        # Determine context (CI vs Deployment)
        IS_CI=false
        case "$ENV" in
          *"CI"*|*"Test"*|*"Build"*|*"Lint"*)
            IS_CI=true
            ;;
        esac

        if [ "$STATUS" = "success" ]; then
          HEADER_EMOJI="🚀"
          if [ "$IS_CI" = "true" ]; then
            STATUS_LABEL="CI Pipeline Passed"
            ENV_EMOJI="🟢"
          else
            STATUS_LABEL="Deployment Succeeded"
            ENV_EMOJI="🟢"
          fi
        elif [ "$STATUS" = "cancelled" ]; then
          HEADER_EMOJI="⚪️"
          STATUS_LABEL="Run Cancelled"
          ENV_EMOJI="⚪️"
        else
          HEADER_EMOJI="❌"
          if [ "$IS_CI" = "true" ]; then
            STATUS_LABEL="CI / Test Suite Failed"
            ENV_EMOJI="🔴"
          else
            STATUS_LABEL="Deployment Failed"
            ENV_EMOJI="🔴"
          fi
        fi

        MSG="<b>${HEADER_EMOJI} ${APP} — ${STATUS_LABEL}</b>%0A%0A"
        MSG+="🏷 <b>Environment:</b> ${ENV_EMOJI} ${ENV}%0A"
        if [ -n "$TAG" ]; then
          MSG+="📦 <b>Release:</b> <code>${TAG}</code>%0A"
        fi
        MSG+="👤 <b>Triggered By:</b> ${GH_ACTOR}%0A"
        MSG+="🔗 <b>Commit:</b> <a href=\"${GH_SERVER_URL}/${GH_REPO}/commit/${GH_SHA}\">${GH_SHA}</a>%0A"
        if [ -n "$URL" ]; then
          MSG+="🌐 <b>Live URL:</b> <a href=\"${URL}\">${URL}</a>%0A"
        fi
        if [ -n "$CUSTOM" ]; then
          MSG+="%0A📝 <i>${CUSTOM}</i>%0A"
        fi
        MSG+="%0A📊 <a href=\"${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}\">View GitHub Actions Run</a>"

        CURL_ARGS=(
          -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"
          -d "chat_id=${CHAT_ID}"
          -d "parse_mode=HTML"
          -d "text=${MSG}"
          -d "disable_web_page_preview=true"
        )
        if [ -n "$THREAD_ID" ]; then
          CURL_ARGS+=(-d "message_thread_id=${THREAD_ID}")
        fi
        RESPONSE=$(curl "${CURL_ARGS[@]}")

        if echo "$RESPONSE" | grep -q '"ok":true'; then
          echo "✅ Telegram notification sent successfully."
        else
          echo "⚠️ Telegram API returned error: $RESPONSE"
        fi
