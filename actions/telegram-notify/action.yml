name: 'Telegram Release & Deployment Notifier'
description: 'Send standardized, rich Telegram notifications for deployments, CI/CD runs, and releases'
author: 'iitdeveloper-git'
branding:
  icon: 'send'
  color: 'blue'

inputs:
  bot_token:
    description: 'Telegram Bot Token from @BotFather'
    required: true
  chat_id:
    description: 'Telegram Group/Channel Chat ID (e.g. -100xxxxxxxxxx)'
    required: true
  message_thread_id:
    description: 'Telegram Topic / Thread ID (for Supergroups with forum topics enabled)'
    required: false
    default: ''
  app_name:
    description: 'Application / Project Name (e.g. MyService)'
    required: false
    default: ''
  environment:
    description: 'Deployment Environment (e.g. Production, Staging, CI / Tests)'
    required: false
    default: 'Production'
  status:
    description: 'Job / Deployment Status (success, failure, cancelled)'
    required: false
    default: 'success'
  release_tag:
    description: 'Release Tag or Version (e.g. v1.0.0)'
    required: false
    default: ''
  app_url:
    description: 'Live Application URL (e.g. https://app.example.com)'
    required: false
    default: ''
  custom_message:
    description: 'Optional custom release notes or description'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run Telegram Notification Dispatcher
      shell: bash
      env:
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_APP: ${{ inputs.app_name }}
        INPUT_ENV: ${{ inputs.environment }}
        INPUT_TAG: ${{ inputs.release_tag }}
        INPUT_URL: ${{ inputs.app_url }}
        INPUT_CUSTOM: ${{ inputs.custom_message }}
        INPUT_THREAD_ID: ${{ inputs.message_thread_id }}
        INPUT_BOT_TOKEN: ${{ inputs.bot_token }}
        INPUT_CHAT_ID: ${{ inputs.chat_id }}
        GH_ACTOR: ${{ github.actor }}
        GH_SERVER_URL: ${{ github.server_url }}
        GH_REPO: ${{ github.repository }}
        GH_SHA: ${{ github.sha }}
        GH_RUN_ID: ${{ github.run_id }}
      run: |
        python3 "${{ github.action_path }}/send.py"
