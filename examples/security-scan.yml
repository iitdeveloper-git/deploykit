name: Security Vulnerability Scan

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Repository Security Scan (Production Gate)
    uses: iitdeveloper-git/deploykit/.github/workflows/security-scan.yml@v1
    with:
      scan-type: 'fs'
      severity: 'CRITICAL,HIGH'
      exit-code: '1' # Fails CI if CRITICAL or HIGH vulnerabilities are found
